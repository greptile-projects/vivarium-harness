name: mirror-sync-test

# Test-only twin of mirror-sync. It replays vivarium-test-komodo into the
# explicitly separate test mirror and never reads the production mirror
# variables or state.
on:
  repository_dispatch:
    types: [test-komodo-main-push]
  # A separate backstop keeps a broken test notifier from hiding indefinitely.
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

concurrency:
  group: mirror-sync-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Mint test mirror app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: ${{ vars.TEST_MIRROR_OWNER }}
          repositories: ${{ vars.TEST_MIRROR_REPO_NAME }}

      - name: Derive bot committer identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" -q .id)"
          echo "BOT_COMMITTER_NAME=${bot_login}" >> "$GITHUB_ENV"
          echo "BOT_COMMITTER_EMAIL=${bot_id}+${bot_login}@users.noreply.github.com" >> "$GITHUB_ENV"

      - name: Run test mirror sync
        env:
          MIRROR_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          HARNESS_ORG_TOKEN: ${{ secrets.HARNESS_ORG_TOKEN }}
          SOURCE_REPO: ${{ vars.TEST_SOURCE_REPO }}
          MIRROR_REPO: ${{ vars.TEST_MIRROR_REPO }}
          HARNESS_REPO: ${{ github.repository }}
          STATE_VAR: TEST_LAST_SYNCED_SHA
        run: ./scripts/mirror_sync.sh
